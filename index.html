<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space City Dashboard</title>
    <!-- Prevents the harmless favicon.ico 404 message in Console -->
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b3d91; /* NASA Blue */
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Twinkling Space Background Effects */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .stars, .stars2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .stars {
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 50px 160px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80px 120px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 110px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 90px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 190px 150px, #fff, rgba(0,0,0,0));
            background-size: 200px 200px;
            animation: twinkle 4s infinite ease-in-out;
        }

        .stars2 {
            background-image: 
                radial-gradient(1.5px 1.5px at 30px 100px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 70px 20px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 120px 140px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 60px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 180px 110px, #fff, rgba(0,0,0,0));
            background-size: 250px 250px;
            animation: twinkle 6s infinite ease-in-out;
            opacity: 0.6;
        }

        /* Houston Astros Orange neon glow */
        .glow-text {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #F4911E, 0 0 30px #F4911E;
            color: #ffffff;
        }
        
        /* Main panel container with matching orange border */
        .container {
            background-color: #111111;
            width: 90%; 
            max-width: 1000px; 
            margin: 40px auto;
            padding: 30px; 
            border-radius: 10px;
            border: 2px solid #F4911E;
            box-shadow: 0px 4px 20px rgba(244, 145, 30, 0.4); 
            position: relative;
            z-index: 10;
            box-sizing: border-box; 
        }

        /* Astros Orange glow shadow around the loaded image */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(244, 145, 30, 0.6); 
            border: 1px solid rgba(244, 145, 30, 0.3);
        }

        p {
            text-align: left;
            line-height: 1.6;
        }

        p a {
            color: #ffb05c;
            text-decoration: underline;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .animated-pulse {
            text-align: center; 
            font-style: italic;
            animation: pulse 2s infinite ease-in-out;
            color: #ffffff; 
        }

        .loaded-status {
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            color: #2ecc71; 
        }

        .control-group {
            margin: 15px auto;
            text-align: center;
        }
        .control-group label {
            font-size: 0.9rem;
            color: #ffb05c;
            margin-right: 8px;
            font-weight: bold;
        }
        .control-group input {
            background: #222222;
            border: 1px solid #F4911E;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            outline: none;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 25px;
            opacity: 0.7;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="stars2"></div>

    <div class="container">
        <h1 class="glow-text">Space City Dashboard</h1>
        <p id="loading-status" class="animated-pulse">Fetching live data from NASA...</p>
        
        <div class="control-group">
            <label for="space-date">MISSION DATE:</label>
            <input type="date" id="space-date" min="1995-06-16">
        </div>
        
        <h2 id="title">Image Title Loading...</h2>
        <div id="media-container"></div>
        <p id="explanation">Loading explanation...</p>
        
        <div class="footer">Created by Zoe Canfield | Space City Dashboard</div>
    </div>
      <script>
        const datePicker = document.getElementById("space-date");
        const todayStr = new Date().toISOString().split("T").at(0);
        datePicker.max = todayStr;

        async function fetchWithFallbacks(nasaEndpoint) {
            const candidates = [
                nasaEndpoint,
                `https://corsproxy.io{encodeURIComponent(nasaEndpoint)}`,
                `https://codetabs.com{encodeURIComponent(nasaEndpoint)}`
            ];

            let lastError = null;
            for (const url of candidates) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return await response.json();
                } catch (err) {
                    lastError = err;
                }
            }
            throw lastError || new Error("Primary APOD feed blocked.");
        }

        async function fetchNasaData(selectedDate = "") {
            const statusText = document.getElementById("loading-status");
            const mediaContainer = document.getElementById("media-container");
            
            statusText.innerText = "Fetching live data from NASA...";
            statusText.className = "animated-pulse";
            statusText.style.color = "#ffffff";

            let nasaEndpoint = "https://nasa.gov";
            
            if (selectedDate) {
                const parts = selectedDate.split("-");
                const yymmdd = parts.at(0).slice(-2) + parts.at(1) + parts.at(2);
                nasaEndpoint = `${nasaEndpoint}/${yymmdd}`;
            }

            try {
                let data = await fetchWithFallbacks(nasaEndpoint);
                
                if (Array.isArray(data)) {
                    data = data.at(0);
                }

                if (!data) {
                    throw new Error("No data returned from NASA.");
                }

                const parsedTitle = data.title || "Astronomy Picture of the Day";
                const parsedExplanation = data.explanation || "No description provided for this date.";
                const imageUrl = data.hdurl || "";
                const altText = data.alt || parsedTitle;

                document.getElementById("title").innerText = parsedTitle;
                document.getElementById("explanation").innerHTML = parsedExplanation;

                if (data.media_type === "video") {
                    mediaContainer.innerHTML = `
                        <p style="text-align: center; margin: 20px 0;">
                            <a href="${data.url}" target="_blank" rel="noopener noreferrer" style="color: #F4911E; font-weight: bold;">
                                ▶ Watch Today's APOD Video on NASA Science
                            </a>
                        </p>`;
                } else if (imageUrl && !imageUrl.includes("nasa-logo")) {
                    mediaContainer.innerHTML = `<img src="${imageUrl}" alt="${altText}">`;
                } else {
                    mediaContainer.innerHTML = `<p style="text-align: center; color: #ffb05c;">No image file available for this date.</p>`;
                }

                statusText.innerText = "TELEMETRY ONLINE • " + (data.date || todayStr);
                statusText.className = "loaded-status";
                statusText.style.color = "#2ecc71";

            } catch (primaryError) {
                // Backup: Pull directly from NASA's CORS-enabled Image Library API if APOD is blocked
                try {
                    const backupRes = await fetch("https://nasa.gov");
                    const backupJson = await backupRes.json();
                    const items = backupJson.collection.items;
                    const randomItem = items.at(Math.floor(Math.random() * 10));
                    const itemData = randomItem.data.at(0);
                    const itemImg = randomItem.links.at(0).href;

                    document.getElementById("title").innerText = itemData.title || "NASA Space Archive";
                    document.getElementById("explanation").innerText = itemData.description || "Loaded via NASA Image Library backup feed.";
                    mediaContainer.innerHTML = `<img src="${itemImg}" alt="${itemData.title}">`;

                    statusText.innerText = "BACKUP TELEMETRY ONLINE • NASA IMAGE ARCHIVE";
                    statusText.className = "loaded-status";
                    statusText.style.color = "#ffb05c";
                } catch (backupError) {
                    console.error("All feeds failed:", primaryError, backupError);
                    document.getElementById("title").innerText = "Failed to load NASA data.";
                    document.getElementById("explanation").innerText = "Network or browser extension blocked NASA APIs (" + primaryError.message + ").";
                    mediaContainer.innerHTML = "";

                    statusText.innerText = "SYSTEM OFFLINE";
                    statusText.className = "loaded-status";
                    statusText.style.color = "#e74c3c";
                }
            }
        }

        fetchNasaData();

        datePicker.addEventListener("change", (event) => {
            fetchNasaData(event.target.value);
        });
    </script>
